<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Buses | Metro Bus Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand brand-bar">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="Metro-Logo.webp" alt="Metro Logo" />
        </a>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Search buses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="manage.html">Manage buses</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h3 page-title mb-4">Search metro buses</h1>

      <form id="searchForm" class="mb-5">
        <div class="search-pill-wrapper">
          <div class="search-input-box">
            <i class="bi bi-search ms-2"></i>
            <select
              id="searchType"
              class="form-select border-0 shadow-none bg-transparent"
            >
              <option value="available">Available buses</option>
              <option value="route">Route</option>
              <option value="departure">Departure location</option>
              <option value="destination">Destination</option>
              <option value="date">Travel date</option>
            </select>
          </div>

          <div class="search-divider"></div>

          <div class="search-input-box" id="termGroup">
            <i class="bi bi-geo-alt ms-2"></i>
            <input
              id="searchTerm"
              type="text"
              class="form-control border-0 shadow-none bg-transparent"
              placeholder="e.g. Kandy, Colombo, Route 138..."
            />
          </div>

          <div class="search-actions">
            <button type="submit" class="btn btn-pill-primary">
              Find Buses
            </button>
            <button
              type="button"
              id="clearBtn"
              class="btn btn-pill-icon"
              title="Clear"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </form>

      <div id="message"></div>
      <div id="resultCount" class="text-muted mb-2"></div>

      <div class="table-responsive card">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Bus ID</th>
              <th>Name</th>
              <th>Route</th>
              <th>Date</th>
              <th>Departs</th>
              <th>Arrives</th>
              <th>Seats</th>
              <th class="text-end">Fare (LKR)</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
